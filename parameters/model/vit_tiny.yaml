type: "vit"

input_patch_length: 16
num_channels: 3
num_classes: 1000

num_features_attention: 256
num_attention_heads: 16

num_features_residual: 256
num_layers_residual_block: 2
activation_function_residual_block: "relu"

num_features_head: 256
num_layers_head: 2
activation_function_head: "relu"
prune_residual_blocks_completely: False

num_transformer_blocks: 12

partial_layer_dropout_prob: 0.0

dropout_rate: 0.1

disable_pruning_partial_layer_dropout: True

attention_scores: "vanilla"

add_pos_embeddings: true
max_context_length: 512