# @package _global_
defaults:
  - override /dataset: syntheticV2
  - override /model: timeseries_decoder

batch_size: 8192
num_gradient_accumulation_steps: 2

train_mixed_precision: true

save_examples: true

model:
  type: timeseries_decoder
  input_patch_length: 16
  num_patches: 64
  use_reversible_input_normalization: true
  num_features_attention: 128
  num_attention_heads: 16
  num_features_residual: 256
  num_layers_residual_block: 2
  activation_function_residual_block: gelu
  num_features_head: 256
  num_layers_head: 2
  activation_function_head: gelu
  num_transformer_blocks: 12
  partial_layer_dropout_prob: 0.0
  dropout_rate: 0.1
  attention_scores: vanilla
  add_pos_embeddings: true
  max_context_length: 512

optimizer:
  learning_rate: 0.001
